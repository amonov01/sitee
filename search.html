<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surf & Travel | Cerca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="anim.css">
</head>
<body data-page="search">

<header class="nav">
  <a href="index.html" class="logo"><img src="images/logo.png" alt="Surf &amp; Travel"></a>
  <button class="burger" id="burger" aria-label="Menu">☰</button>
  <nav id="menu">
    <a href="index.html">Home</a>
    <a href="search.html" class="active">Cerca</a>
    <a href="destinazione.html">Destinazioni</a>
    <a href="#newsletter" class="btn btn-sm">Contatti</a>
  </nav>
</header>

<section class="hero small">
  <h1>Prenota il tuo prossimo surf camp</h1>
  <input type="search" id="q" class="searchbar" placeholder="Cerca una destinazione...">
</section>

<section class="section">
  <h2>Quale sarà la tua prossima meta?</h2>
  <div class="searchlayout">
    <aside class="filters">
      <strong>Regione</strong>
      <label><input type="checkbox" value="Europa"> Europa</label>
      <label><input type="checkbox" value="Africa"> Africa</label>
      <label><input type="checkbox" value="Asia"> Asia</label>
      <label><input type="checkbox" value="America"> America</label>
      <label><input type="checkbox" value="Oceania"> Oceania</label>
    </aside>
    <div>
      <p id="count" class="sub"></p>
      <div class="cards" id="results"></div>
    </div>
  </div>
</section>

<footer class="footer" id="newsletter">
  <h2>Iscriviti alla Newsletter</h2>
  <form id="nlForm">
    <input type="email" id="email" placeholder="La tua email" required>
    <button class="btn" type="submit">Iscriviti</button>
  </form>
  <p id="nlMsg" class="msg"></p>
  <div class="fcols">
    <div><strong>Surf &amp; Travel</strong><p>Camp, onde e viaggi.</p></div>
    <div><strong>Menu</strong><a href="index.html">Home</a><a href="search.html">Cerca</a><a href="destinazione.html">Destinazioni</a></div>
    <div><strong>Seguici</strong><a href="#">Instagram</a><a href="#">Facebook</a></div>
  </div>
</footer>

<script src="pages.js"></script>
<script src="anim.js"></script>
</body>
</html>
